# onprem/multiuser.conf — cove.ndexr.io's `cove multiuser` (2026-10-13).
# Read by the root unit cove-onprem-multiuser at start; restart it after
# a change (run.sh does, on every build).
#
# Every ndexr user signs in once at console.ndexr.io: nginx's /__auth_check
# names them (X-Remote-User = their ndexr username, conf.d/ndexr_user_map.conf)
# and adds the proxy key, which only root and nginx can read. Each person's
# sessions run as their own account on this host (ood-sync-users keeps one
# per ndexr user, all in group ndexr).
auth = proxy
proxy-header = X-Remote-User
proxy-key-file = /etc/cove/proxy.key
allow-groups = ndexr
# The operator administers, and works on the platform's repository as its
# owner, as code.ndexr.io does.
admin-users = drennanfreddy
run-as = drennanfreddy:ubuntu
min-uid = 1000
max-sessions-per-user = 5
# What one person may use, across every session, terminal, app and build of
# theirs (app/src/limits.rs, 2026-10-25): this box has 24 cores and 30 GB,
# shared by everyone. A build past the memory is killed inside the person's
# own share; past the cores it waits. Builds are sized to the cores
# (CARGO_BUILD_JOBS, MAKEFLAGS, JULIA_NUM_THREADS). The platform account is
# never limited. Restart cove-onprem-multiuser after a change; new sessions
# write the new limits.
person-memory = 6G
person-cpus = 4
person-tasks = 4096
max-sessions = 120
idle-minutes = 240
# Clear of the per-user code-servers (26000-31999) and the ephemeral range.
ports = 32100-32399
audit-log = /var/log/cove/audit.log
# RStudio sessions next to the ide (2026-10-13): one Inlet rserver per
# session, started as the person. Installed by install-multiuser.sh.
rstudio-launcher = /usr/local/lib/cove/rstudio-session
# Positron sessions (2026-10-14): one `ml Positron-Server` server per session,
# started as the person, at /p/<id>/. Installed by install-multiuser.sh.
positron-launcher = /usr/local/lib/cove/positron-session
