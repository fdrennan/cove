# /etc/cove/multiuser.conf — `cove multiuser`, read at start
# (restart cove-multiuser after a change). An unknown key stops the
# server rather than being ignored.

# Groups whose members may sign in. Empty: any account at or above min-uid.
allow-groups =

# Groups whose members see /admin (sessions, Stop).
admin-groups = sudo, wheel, cove-admin

# Accounts below this uid (system accounts) never sign in.
min-uid = 1000

# An idle session (no request from its browser) ends after this long.
idle-minutes = 120

# Loopback ports for the people's sessions.
ports = 27800-27999
