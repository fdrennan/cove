[package]
name = "__CRATE__"
version = "0.1.0"
edition = "2021"
description = "__HOST__ - a Rust app, started from Cove's template"

# One binary, two jobs: `app serve` is the site (the API, the media work and
# the browser UI's files); `app` alone opens the same UI as a desktop window.
[[bin]]
name = "app"
path = "src/main.rs"

# Exact versions, the stack's Rust set (manifests/Rust/1.96.0): a new app
# builds what the set vendors - offline too, from $NDEXR_RUST_VENDOR - not
# whatever crates.io serves the day it is made (2026-10-21, fixed versions for
# every record, as svbt's manifests now are).
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# The UI's HTTP client to `app serve`: fetch() in a browser, a thread natively.
ehttp = "=0.7.1"
# Upload: the device's file picker, in a browser and on a desktop.
rfd = "=0.15.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "=0.36.2", features = ["persistence"] }
tiny_http = "=0.12.0"
pollster = "=0.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "persistence", "default_fonts"] }
# Pinned to the wasm-bindgen-cli build-web.sh runs (the same one Cove uses).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["Document", "Element", "HtmlCanvasElement", "Location", "Window"] }
