<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Digit Lab · __HOST__</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="stage">
  <aside class="glass panel models">
    <header>
      <h1>Digit Lab</h1>
      <p>Draw 0-9. Three scikit-learn models read it live.</p>
    </header>
    <div class="seg" id="model-seg" role="tablist" aria-label="model"></div>
    <div class="scores">
      <div><span class="k">train</span><b id="acc-train">–</b></div>
      <div><span class="k">test</span><b id="acc-test">–</b></div>
      <div><span class="k">fit</span><b id="fit-ms">–</b></div>
    </div>
    <figure class="cm">
      <figcaption>Confusion matrix · <span id="n-test">–</span> held-out digits</figcaption>
      <canvas id="cm" aria-label="confusion matrix: true digit by row, predicted by column"></canvas>
      <div id="cm-tip" class="tip" hidden></div>
    </figure>
  </aside>

  <section class="board">
    <div class="pad glass">
      <canvas id="draw" aria-label="drawing pad"></canvas>
      <div id="hint" class="hint">draw a digit</div>
      <div class="pad-buttons">
        <button id="clear" type="button">Clear</button>
        <button id="sample" type="button" class="primary">Sample</button>
      </div>
      <div id="truth" class="truth" hidden></div>
    </div>
  </section>

  <aside class="glass panel result">
    <div class="verdict">
      <div class="big" id="guess">?</div>
      <div class="sure"><span class="k">confidence</span><b id="conf">–</b><span class="k" id="ms"></span></div>
    </div>
    <div id="bars" class="bars" aria-label="probability per digit"></div>
    <div class="seen-row">
      <figure class="seen">
        <canvas id="seen" width="8" height="8" aria-label="the 8x8 image the model saw"></canvas>
        <figcaption>what the model saw · 8x8, 0-16</figcaption>
      </figure>
      <ul id="others" class="others"></ul>
    </div>
  </aside>
</main>
<script src="/static/app.js"></script>
</body>
</html>
