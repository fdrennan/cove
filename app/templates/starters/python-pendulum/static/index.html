<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Double Pendulum Lab · __HOST__</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<canvas id="stage" aria-label="The pendulums, animated"></canvas>

<header class="glass title">
  <h1>Double Pendulum Lab</h1>
  <p id="sub">integrating…</p>
  <div class="tiles">
    <div><span class="k">t</span><b id="t">–</b></div>
    <div><span class="k">λ (1/s)</span><b id="lam">–</b></div>
    <div><span class="k">doubles in</span><b id="dbl">–</b></div>
    <div><span class="k">max |ΔE|</span><b id="drift">–</b></div>
  </div>
</header>

<section class="charts">
  <figure class="glass mini">
    <figcaption><span>Distance from pendulum 0's tip</span><output id="div-v"></output></figcaption>
    <canvas id="divC" aria-label="log10 distance between tips over time"></canvas>
    <div class="legend" id="div-legend"></div>
  </figure>
  <figure class="glass mini">
    <figcaption><span>Energy drift, worst pendulum</span><output id="en-v"></output></figcaption>
    <canvas id="enC" aria-label="log10 relative energy drift over time"></canvas>
  </figure>
</section>

<details id="card" class="glass card" open>
  <summary>The pendulums</summary>
  <div id="sliders"></div>
  <div class="seg" id="methods"></div>
  <label class="row">playback <output id="speed-v">1×</output><input id="speed" type="range" min="0.1" max="2" step="0.05" value="1"></label>
  <div class="buttons">
    <button id="run" class="primary" type="button">Integrate</button>
    <button id="play" type="button">Pause</button>
  </div>
  <p class="foot" id="foot"></p>
</details>

<script src="static/app.js"></script>
</body>
</html>
