<title>Freddy's week · 2026-11-26</title>
<!--
  The operator's week (operator, 2026-11-26: "look at exec.ndexr.io,
  ops.ndexr.io, ndexr.io, cove.ndexr.io and ndexr.ndexr.io and create a
  dashboard explaining what we have been doing and help me keep my week
  organized. mail.drennanfreddy.ndexr.io work and helping me keep that
  together is important too").

  Data first: everything shown is the WEEK object below, read on 2026-11-26
  from each domain's git log, CONTEXT.md / CLAUDE.md / PRIORITIES.md and
  WHATSNEW.md (commit hashes and file:line are the evidence). Ticks are kept
  in this browser's localStorage, keyed by item id, so renaming an item's
  text keeps its tick. Open it in Cove (Render, Ctrl+Shift+K, shows it in the
  Viewer) or any browser. To refresh: edit WEEK, or ask the cove agent.
-->
<style>
  :root {
    --deep:#0e1417; --tide:#151d21; --tide2:#1c262b; --foam:#d6e0e3; --strong:#f2f6f7;
    --mist:#9fb0b6; --hush:#6d7f86; --moss:#2c3a40; --signal:#5cc8c0; --buoy:#e8b24a;
    --ok:#7fcf8f; --bad:#e8776a;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--deep); color:var(--foam); font:15px/1.5 Inter, system-ui, sans-serif }
  main { max-width:1180px; margin:0 auto; padding:28px 20px 60px }
  h1 { font-size:30px; margin:0 0 4px; color:var(--strong); font-weight:650; letter-spacing:-.01em }
  h2 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); margin:34px 0 12px }
  h3 { font-size:17px; margin:0 0 8px; color:var(--strong) }
  .lead { color:var(--foam); font-size:16px; max-width:820px }
  .grid { display:grid; gap:14px }
  .g4 { grid-template-columns:repeat(auto-fit,minmax(200px,1fr)) }
  .g2 { grid-template-columns:repeat(auto-fit,minmax(340px,1fr)) }
  .card { background:var(--tide); border:1px solid var(--moss); border-radius:12px; padding:16px 18px }
  .stat b { display:block; font-size:30px; color:var(--strong); font-weight:650 }
  .stat span { color:var(--foam) }
  .mail { border-color:var(--buoy) }
  .mail h3 { color:var(--buoy) }
  ul { margin:0; padding-left:18px }
  li { margin:4px 0 }
  code, .h { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:12.5px; color:var(--signal) }
  .day { display:flex; flex-direction:column; gap:6px }
  .day h3 { display:flex; justify-content:space-between; align-items:baseline }
  .day h3 small { color:var(--foam); font-weight:400; font-size:13px }
  .today { border-color:var(--signal); box-shadow:0 0 0 1px var(--signal) inset }
  label.t { display:flex; gap:10px; align-items:flex-start; padding:7px 8px; border-radius:8px; cursor:pointer }
  label.t:hover { background:var(--tide2) }
  label.t input { margin-top:4px; accent-color:var(--signal); width:16px; height:16px; flex:none }
  label.t.done span { text-decoration:line-through; color:var(--hush) }
  .tag { font-size:11px; padding:1px 8px; border-radius:9px; background:var(--tide2); color:var(--foam); margin-left:6px; white-space:nowrap }
  .tag.mail { background:rgba(232,178,74,.16); color:var(--buoy) }
  .tag.you { background:rgba(92,200,192,.16); color:var(--signal) }
  .bar { height:8px; background:var(--moss); border-radius:4px; overflow:hidden; margin-top:8px }
  .bar i { display:block; height:100%; background:var(--signal) }
  table { width:100%; border-collapse:collapse }
  td { padding:6px 8px; border-top:1px solid var(--moss); vertical-align:top }
  td:first-child { color:var(--strong); white-space:nowrap }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center }
  button { background:var(--tide2); color:var(--foam); border:1px solid var(--moss); border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer }
  button:hover { border-color:var(--signal) }
</style>
</head>

<div id="app"></div>

<script>
const W = JSON.parse(document.getElementById('week').textContent);
const KEY = 'ndexr-week-ticks';
const ticks = JSON.parse(localStorage.getItem(KEY) || '{}');
const save = () => localStorage.setItem(KEY, JSON.stringify(ticks));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Hashes and file:line drawn as code: they are the evidence.
const ev = s => esc(s).replace(/\b([0-9a-f]{7,10})\b|([\w.-]+\.(?:md|js|r|rs):\d+)|(#\d{3,})/g, m => `<span class="h">${m}</span>`);
const today = new Date().toISOString().slice(0, 10);

function render() {
  const all = W.days.flatMap(d => d.items);
  const done = all.filter(i => ticks[i[0]]).length;
  const mailAll = all.filter(i => i[2] === 'mail'), mailDone = mailAll.filter(i => ticks[i[0]]).length;
  const tagWord = {mail: 'mail', you: 'you', cove: 'cove', exec: 'exec', ops: 'ops', stack: 'stack', front: 'ndexr.io'};
  document.getElementById('app').innerHTML = `
    <h1>Freddy's week</h1>
    <p class="lead">What we have been doing across Cove, the stack, the front door, exec and ops, ${esc(W.window)}, and what to do next. Mail has its own column, because it matters.</p>

    <div class="grid g4" style="margin-top:18px">
      ${W.stats.map(s => `<div class="card stat"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('')}
      <div class="card stat"><b>${done} / ${all.length}</b><span>this plan done (${mailDone} / ${mailAll.length} mail)</span><div class="bar"><i style="width:${all.length ? 100 * done / all.length : 0}%"></i></div></div>
    </div>

    <h2>The plan</h2>
    <div class="grid g4">
      ${W.days.map(d => `<div class="card day ${d.date === today ? 'today' : ''}">
        <h3>${esc(d.day)}<small>${d.items.filter(i => ticks[i[0]]).length}/${d.items.length}</small></h3>
        ${d.items.map(([id, text, tag]) => `<label class="t ${ticks[id] ? 'done' : ''}"><input type="checkbox" data-id="${id}" ${ticks[id] ? 'checked' : ''}><span>${ev(text)}<span class="tag ${tag}">${tagWord[tag] || tag}</span></span></label>`).join('')}
      </div>`).join('')}
    </div>

    <h2>Mail · mail.drennanfreddy.ndexr.io</h2>
    <div class="grid g2">
      <div class="card mail"><h3>Where it stands</h3><p style="margin:0">${esc(W.mail.state)}</p></div>
      <div class="card mail"><h3>Expenses</h3><table>${W.mail.money.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${ev(r[2])}</td></tr>`).join('')}</table></div>
    </div>

    <h2>Waiting on you</h2>
    <div class="card"><ul>${W.decisions.map(d => `<li>${ev(d)}</li>`).join('')}</ul></div>

    <h2>What we did, by domain</h2>
    <div class="grid g2">
      ${W.domains.map(d => `<div class="card"><h3>${esc(d.name)} <span class="tag">${esc(d.what)}</span></h3>
        <ul>${d.done.map(x => `<li>${ev(x)}</li>`).join('')}</ul>
        <h3 style="margin-top:12px;font-size:14px;color:var(--buoy)">Open</h3>
        <ul>${d.open.map(x => `<li>${ev(x)}</li>`).join('')}</ul></div>`).join('')}
    </div>

    <h2>What runs by itself</h2>
    <div class="card"><table>${W.schedules.map(s => `<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td></tr>`).join('')}</table></div>

    <div class="row" style="margin-top:22px"><button id="clear">Clear ticks</button><span>Read ${esc(W.read)}. Ticks stay in this browser.</span></div>`;
  document.querySelectorAll('input[data-id]').forEach(b => b.onchange = () => { ticks[b.dataset.id] = b.checked; save(); render(); });
  document.getElementById('clear').onclick = () => { for (const k in ticks) delete ticks[k]; save(); render(); };
}
render();
</script>
